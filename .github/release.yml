changelog:
  exclude:
    labels:
      - ignore-for-release
      - duplicate
      - question
    authors:
      - dependabot
  categories:
    - title: New Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: Maintenance
      labels:
        - chore
        - dependencies
        - ci
    - title: Other Changes
      labels:
        - '*'
