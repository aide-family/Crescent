name: Bug report
description: Report a reproducible problem in Crescent.
title: '[Bug]: '
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Crescent. Clear reproduction details help us investigate faster.
  - type: input
    id: version
    attributes:
      label: Crescent version
      description: Include the app version, release tag, or commit SHA.
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the unexpected behavior and the impact.
      placeholder: Crescent failed to...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest set of steps that reliably triggers the bug.
      placeholder: |
        1. Open Crescent
        2. Go to ...
        3. Click ...
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: Crescent should...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Drag screenshots here or paste relevant logs. Remove secrets, tokens, hostnames, and private paths first.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add anything else that may help, such as terminal type, SSH setup, model provider, or MCP/OpenAPI configuration.
