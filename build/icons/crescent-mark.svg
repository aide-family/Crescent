<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" role="img" aria-label="Crescent">
  <title>Crescent Mark</title>
  <desc>Flat teal crescent moon with terminal chevron for in-app logo and favicon.</desc>

  <defs>
    <mask id="markCrescentMask" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="black"/>
      <circle cx="54" cy="64" r="38" fill="white"/>
      <circle cx="70" cy="62" r="31" fill="black"/>
    </mask>
  </defs>

  <!-- Transparent canvas for UI embedding; pair with dark charcoal surfaces (#1E1E1E / #0D1117). -->
  <circle cx="54" cy="64" r="38" fill="#2DD4BF" mask="url(#markCrescentMask)"/>
  <path
    d="M74 44 L94 64 L74 84"
    stroke="#2DD4BF"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
