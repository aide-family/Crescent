<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-label="Crescent">
  <title>Crescent App Icon</title>
  <desc>Glowing cyan crescent moon with terminal prompt on dark charcoal background.</desc>

  <defs>
    <linearGradient id="crescentFill" x1="220" y1="780" x2="760" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.45" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="bgWash" cx="48%" cy="42%" r="62%" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#162032"/>
      <stop offset="0.55" stop-color="#121820"/>
      <stop offset="1" stop-color="#0D1117"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="28" result="blur"/>
      <feColorMatrix
        in="blur"
        type="matrix"
        values="0 0 0 0 0.22
                0 0 0 0 0.72
                0 0 0 0 0.98
                0 0 0 0.55 0"
        result="glow"
      />
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="promptGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="crescentMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="black"/>
      <circle cx="456" cy="512" r="268" fill="white"/>
      <circle cx="552" cy="500" r="228" fill="black"/>
    </mask>
  </defs>

  <!-- Full-bleed square master; OS applies squircle/mask. Charcoal, not pure black. -->
  <rect width="1024" height="1024" fill="url(#bgWash)"/>

  <g filter="url(#softGlow)">
    <circle cx="456" cy="512" r="268" fill="url(#crescentFill)" mask="url(#crescentMask)"/>
  </g>

  <!-- Terminal prompt: >_ -->
  <g filter="url(#promptGlow)" stroke="#F8FAFC" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M548 418 L658 512 L548 606"/>
    <path d="M692 598 H812"/>
  </g>
</svg>
