appId: com.crescent.app
productName: Crescent
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!node_modules/@tailwindcss/**/*'
  - '!design/**/*'
  - '!build/icons/preview/**/*'
asarUnpack:
  - resources/**
  # node-pty loads native binaries from prebuilds/<platform>-<arch> at runtime.
  - '**/node-pty/prebuilds/**'
  - '**/node-pty/build/Release/**'
extraResources:
  - from: system-skills
    to: system-skills
win:
  executableName: crescent
  icon: build/icon.ico
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: true
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
  artifactName: ${name}-${version}-${arch}.${ext}
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
# node-pty ships N-API prebuilds for darwin/win32/linux. Do not force node-gyp rebuild
# during packaging — that breaks cross-compiling Windows/Linux targets from macOS.
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
